<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2026 MNSSHP Wait Time Tracker</title><style>:root{--bg:#0b0f14;--panel:#121821;--card:#171f2a;--text:#f6f7f9;--muted:#aab4c0;--border:#2a3441;--accent:#ff8a3d;--tron:#59a7ff;--tiana:#66d17a;--bt:#ffd166;--hm:#c58cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;padding:16px}h1{margin:0 0 4px;font-size:clamp(27px,6vw,44px)}.sub,.muted{color:var(--muted)}.tabs,.controls,.legend{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0}.tabs button,.chip{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 13px;font:inherit}.tabs button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}.chip.active{outline:2px solid var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:3px}.section{font-size:12px;color:var(--muted);margin:12px 0 7px}.chart-shell{margin-top:12px;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--panel)}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}svg{display:block;width:100%;min-width:900px;height:auto}.legend{padding:10px 12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}.note{margin-top:14px;padding:13px;border-radius:15px;border:1px solid rgba(255,138,61,.35);background:rgba(255,138,61,.1);line-height:1.45}.empty{padding:42px 18px;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:18px}.empty b{font-size:24px;display:block;margin-bottom:7px}@media(max-width:700px){.app{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:21px}}</style></head><body><main class="app"><h1>2026 MNSSHP Wait Time Tracker</h1><div class="sub">Magic Kingdom • Party-night ride waits compared with entertainment</div><div class="tabs"><button data-tab="all">All Parties</button><button data-tab="2026-08-18" class="active">Aug 18</button><button data-tab="2026-08-21">Aug 21</button><button data-tab="2026-08-22">Aug 22</button></div><div id="view"></div></main><script>const parties={"2026-08-18":{label:"Aug 18",data:[["4:00 PM",40,35,25,13],["4:15 PM",45,35,30,13],["4:30 PM",50,35,25,13],["4:45 PM",50,35,25,13],["5:00 PM",70,35,20,20],["5:15 PM",55,35,20,20],["5:30 PM",45,35,15,20],["5:45 PM",40,35,10,20],["6:00 PM",40,35,10,20],["6:45 PM",35,20,15,15],["7:00 PM",35,20,15,15],["7:15 PM",30,15,15,15],["7:30 PM",25,15,15,15],["7:45 PM",35,20,15,20],["8:00 PM",45,20,15,20],["8:15 PM",50,5,15,20],["8:30 PM",50,5,10,20],["8:45 PM",50,15,10,25],["9:00 PM",45,null,15,20],["9:15 PM",40,10,15,20],["9:30 PM",40,10,15,15],["9:45 PM",45,10,15,15],["10:00 PM",25,10,10,15],["10:15 PM",25,10,10,15],["10:30 PM",50,10,10,15],["10:45 PM",70,10,10,15],["11:00 PM",30,10,10,null],["11:15 PM",30,5,10,15],["11:30 PM",25,5,10,null],["11:45 PM",25,5,10,null]],events:[["Boo-To-You","8:15 PM","boo"],["Hocus Pocus","9:05 PM","hocus"],["Fireworks","10:00 PM","fireworks"],["Hocus Pocus","10:35 PM","hocus"],["Boo-To-You","11:15 PM","boo"],["Hocus Pocus","11:59 PM","hocus"]]}},rides=[{n:"TRON",i:1,c:"var(--tron)"},{n:"Tiana’s",i:2,c:"var(--tiana)"},{n:"Big Thunder",i:3,c:"var(--bt)"},{n:"Haunted Mansion",i:4,c:"var(--hm)"}];let tab="2026-08-18",enabled=new Set(rides.map(r=>r.n)),eventsOn=new Set(["boo","fireworks","hocus"]);const view=document.getElementById("view");function mins(t){let[a,p]=t.split(" "),[h,m]=a.split(":").map(Number);if(p==="PM"&&h!==12)h+=12;return h*60+m}function low(d,i){return Math.min(...d.map(r=>r[i]).filter(v=>v!=null))}function render(){let keys=Object.keys(parties);if(tab!=="all"&&!parties[tab]){view.innerHTML=`<div class="empty"><b>Awaiting ${tab.slice(5)} party data</b><span class="muted">This tab will populate after that party night is collected.</span></div>`;return}let selected=tab==="all"?keys:[tab],p=parties[selected[0]],d=p.data;view.innerHTML=`${tab==="all"?`<div class="note"><b>All Parties:</b> ${keys.length} party captured so far. With one night available, this currently matches the Aug 18 baseline.</div>`:""}<div class="stats"><div class="stat"><small>TRON low</small><b>${low(d,1)} min</b></div><div class="stat"><small>Tiana’s low</small><b>${low(d,2)} min</b></div><div class="stat"><small>Big Thunder low</small><b>${low(d,3)} min</b></div><div class="stat"><small>Strongest signal</small><b>10 PM</b></div></div><div class="section">RIDES — tap to show/hide</div><div class="controls" id="rides"></div><div class="section">ENTERTAINMENT — tap to show/hide</div><div class="controls" id="events"></div><div class="chart-shell"><div class="scroll"><svg id="chart" viewBox="0 0 980 540"></svg></div><div class="legend"><span><i class="dot" style="background:var(--tron)"></i>TRON</span><span><i class="dot" style="background:var(--tiana)"></i>Tiana’s</span><span><i class="dot" style="background:var(--bt)"></i>Big Thunder</span><span><i class="dot" style="background:var(--hm)"></i>Haunted Mansion</span><span style="color:var(--accent)">│ Entertainment</span></div></div><div class="note"><b>First-night pattern:</b> TRON fell from 45 min at 9:45 PM to 25 min during the 10:00 PM fireworks, then climbed to 50 at 10:30 and 70 at 10:45. Tiana’s reached 5 min during the first Boo-To-You parade.</div>`;rides.forEach(r=>{let b=document.createElement("button");b.className="chip "+(enabled.has(r.n)?"active":"");b.textContent=r.n;b.onclick=()=>{enabled.has(r.n)?enabled.delete(r.n):enabled.add(r.n);render()};document.getElementById("rides").appendChild(b)});[["boo","Boo-To-You"],["fireworks","Fireworks"],["hocus","Hocus Pocus"]].forEach(([k,n])=>{let b=document.createElement("button");b.className="chip "+(eventsOn.has(k)?"active":"");b.textContent=n;b.onclick=()=>{eventsOn.has(k)?eventsOn.delete(k):eventsOn.add(k);render()};document.getElementById("events").appendChild(b)});draw(d,p.events)}function draw(d,ev){const s=document.getElementById("chart"),W=980,H=540,L=66,R=24,T=26,B=58,pw=W-L-R,ph=H-T-B,x=t=>L+(mins(t)-mins("4:00 PM"))/(mins("11:59 PM")-mins("4:00 PM"))*pw,y=v=>T+(75-v)/75*ph,ns="http://www.w3.org/2000/svg";function E(t,a={},txt=""){let n=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(txt)n.textContent=txt;s.appendChild(n);return n}E("rect",{x:0,y:0,width:W,height:H,fill:"#121821"});for(let v=0;v<=75;v+=15){E("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:"#2a3441"});E("text",{x:L-12,y:y(v)+4,"text-anchor":"end",fill:"#aab4c0","font-size":13},v)}["4:00 PM","5:00 PM","6:00 PM","7:00 PM","8:00 PM","9:00 PM","10:00 PM","11:00 PM"].forEach(t=>E("text",{x:x(t),y:H-22,"text-anchor":"middle",fill:"#aab4c0","font-size":13},t.replace(":00","")));let xs=x("6:15 PM"),xe=x("6:30 PM");E("rect",{x:xs,y:T,width:xe-xs,height:ph,fill:"#fff",opacity:.05});ev.filter(e=>eventsOn.has(e[2])).forEach((e,j)=>{let xx=x(e[1]);E("line",{x1:xx,x2:xx,y1:T,y2:T+ph,stroke:"#ff8a3d","stroke-width":2,"stroke-dasharray":e[2]==="fireworks"?"9 6":"4 6"});E("text",{x:xx+5,y:T+15+(j%3)*16,fill:"#f6f7f9","font-size":11,"font-weight":700},e[0])});rides.filter(r=>enabled.has(r.n)).forEach(r=>{let seg=[];function flush(){if(seg.length>1)E("polyline",{points:seg.map(q=>`${x(q[0])},${y(q[r.i])}`).join(" "),fill:"none",stroke:r.c,"stroke-width":4,"stroke-linecap":"round","stroke-linejoin":"round"});seg=[]}d.forEach(q=>{if(q[r.i]==null)flush();else seg.push(q)});flush();d.forEach(q=>{if(q[r.i]!=null){let c=E("circle",{cx:x(q[0]),cy:y(q[r.i]),r:5,fill:r.c});let title=document.createElementNS(ns,"title");title.textContent=`${q[0]} • ${r.n}: ${q[r.i]} min`;c.appendChild(title)}})})}document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));render()});render();</script></body></html>
