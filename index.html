<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2026 MNSSHP Wait Time Tracker</title><style>:root{--bg:#0b0f14;--panel:#121821;--card:#171f2a;--text:#f6f7f9;--muted:#aab4c0;--border:#2a3441;--accent:#ff8a3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1180px;margin:auto;padding:16px}h1{margin:0 0 4px;font-size:clamp(27px,6vw,44px)}.sub,.muted{color:var(--muted)}button,input,select{font:inherit}.tabs,.controls,.legend,.filters{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0;overflow-x:auto;flex-wrap:nowrap}.tabs button,.chip,select{white-space:nowrap;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 13px}.tabs button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}.chip.active{outline:2px solid var(--accent)}.filters{align-items:end;margin:12px 0}.filter label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px 5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:3px}.section{font-size:12px;color:var(--muted);margin:12px 0 7px}.ride-tools{display:flex;gap:8px;flex-wrap:wrap}.search{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 11px;min-width:210px}.chart-shell{margin-top:12px;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--panel)}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}svg{display:block;width:100%;min-width:940px;height:auto}.legend{padding:10px 12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}.note{margin-top:14px;padding:13px;border-radius:15px;border:1px solid rgba(255,138,61,.35);background:rgba(255,138,61,.1);line-height:1.45}.empty,.loading{padding:38px 12px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:18px}.count{color:var(--muted);font-size:12px}@media(max-width:700px){.app{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:21px}.search{width:100%}}</style></head><body><main class="app"><h1>2026 MNSSHP Wait Time Tracker</h1><div class="sub">Magic Kingdom • Ride waits by party, weather & entertainment</div><div class="tabs" id="tabs"></div><div class="filters"><div class="filter"><label for="weather">Weather pattern</label><select id="weather"><option value="all">All Weather</option><option value="clear">Clear / Dry</option><option value="cloudy">Cloudy</option><option value="rain">Rain / Showers</option><option value="hot">Hot</option><option value="cooler">Cooler</option></select></div></div><div id="view"><div class="loading">Loading party data…</div></div></main><script>
const HEAD=["TRON Lightcycle / Run","Tiana's Bayou Adventure","Big Thunder Mountain Railroad","Haunted Mansion"],COLORS=["#59a7ff","#66d17a","#ffd166","#c58cff","#ff7f7f","#64d8cb","#f2a65a","#8ea1ff","#dc8cff","#9bd16f","#f48fb1","#80cbc4","#ffb74d","#90caf9","#ce93d8","#aed581","#ffcc80","#81d4fa","#ef9a9a","#b39ddb","#80deea","#c5e1a5","#ffe082","#bcaaa4","#b0bec5"];
let rows=[],events=[],dates=[],tab="all",weather="all",enabled=new Set(),eventsOn=new Set(["boo","fireworks","hocus"]),searchText="";const view=document.getElementById("view"),tabs=document.getElementById("tabs"),weatherSel=document.getElementById("weather");
function csv(t){let o=[],r=[],f="",q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=""}else if(c==='\n'){r.push(f);o.push(r);r=[];f=""}else if(c!=='\r')f+=c}if(f||r.length){r.push(f);o.push(r)}let h=o.shift();return o.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]??""])))}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}function fmtPull(iso){return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit"})}function mins(iso){let d=new Date(iso);return d.getHours()*60+d.getMinutes()}function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function num(v){return v===""?null:+v}
function wx(r){let code=num(r.weather_code),temp=num(r.temperature_f),feel=num(r.feels_like_f),prec=Math.max(num(r.precipitation_in)||0,num(r.rain_in)||0,num(r.showers_in)||0);return{clear:prec===0&&(code===0||code===1),cloudy:prec===0&&code!=null&&[2,3,45,48].includes(code),rain:prec>0||(code!=null&&code>=51&&code<=99),hot:(temp!=null&&temp>=90)||(feel!=null&&feel>=95),cooler:(temp!=null&&temp<85)&&(feel==null||feel<90)}}function match(r){return weather==="all"||!!wx(r)[weather]}
function baseRows(){return tab==="all"?rows.filter(r=>dates.includes(r.party_date)):rows.filter(r=>r.party_date===tab)}function selectedRows(){return baseRows().filter(match)}function rideNames(rs){return [...new Set(rs.filter(r=>r.posted_wait_minutes!=="").map(r=>r.ride_name))].sort((a,b)=>a.localeCompare(b))}function resetEnabled(){let n=rideNames(selectedRows());enabled=new Set(HEAD.filter(h=>n.includes(h)));if(!enabled.size)n.slice(0,4).forEach(x=>enabled.add(x))}
function renderTabs(){tabs.innerHTML="";[["all","All Parties"],...dates.map(d=>[d,fmtDate(d)])].forEach(([k,n])=>{let b=document.createElement("button");b.textContent=n;b.classList.toggle("active",k===tab);b.onclick=()=>{tab=k;renderTabs();resetEnabled();render()};tabs.appendChild(b)})}
function low(rs,n){let a=rs.filter(r=>r.ride_name===n&&r.posted_wait_minutes!=="").map(r=>+r.posted_wait_minutes);return a.length?Math.min(...a):null}
function points(rs,n){let by={};rs.filter(r=>r.ride_name===n&&r.posted_wait_minutes!=="").forEach(r=>{let m=Math.round(mins(r.snapshot_time)/15)*15;if(m<960||m>1440)return;(by[m]??=[]).push({v:+r.posted_wait_minutes,pull:r.snapshot_time,date:r.party_date})});return Object.entries(by).map(([m,a])=>({m:+m,v:tab==="all"?med(a.map(x=>x.v)):a[a.length-1].v,pulls:a.map(x=>x.pull),dates:a.map(x=>x.date)})).sort((a,b)=>a.m-b.m)}
function evts(){let ds=tab==="all"?dates:[tab],seen=new Set(),out=[];events.filter(e=>ds.includes(e.party_date)&&e.show_start_time).forEach(e=>{let n=e.event_name.toLowerCase(),cat=n.includes("boo-to-you")?"boo":n.includes("hocus pocus")?"hocus":n.includes("not-so-spooky")||n.includes("not so spooky")?"fireworks":null;if(!cat)return;let m=mins(e.show_start_time);if(m<960)m+=1440;let k=cat+":"+m;if(seen.has(k))return;seen.add(k);out.push({cat,m,name:cat==="boo"?"Boo-To-You":cat==="hocus"?"Hocus Pocus":"Fireworks"})});return out}
function weatherLabel(){return{all:"All Weather",clear:"Clear / Dry",cloudy:"Cloudy",rain:"Rain / Showers",hot:"Hot",cooler:"Cooler"}[weather]}function summary(rs){let u=new Map;rs.forEach(r=>{if(r.snapshot_time&&!u.has(r.snapshot_time))u.set(r.snapshot_time,r)});let a=[...u.values()],t=a.map(r=>num(r.temperature_f)).filter(Number.isFinite),f=a.map(r=>num(r.feels_like_f)).filter(Number.isFinite),p=a.map(r=>Math.max(num(r.precipitation_in)||0,num(r.rain_in)||0,num(r.showers_in)||0));return{samples:a.length,hi:t.length?Math.max(...t):null,lo:t.length?Math.min(...t):null,feel:f.length?Math.max(...f):null,rain:p.length?Math.max(...p):0}}
function render(){let rs=selectedRows();if(!rs.length){view.innerHTML=`<div class="empty"><b>No ${weatherLabel()} observations yet.</b><br>This will populate automatically when a captured party contains this weather pattern.</div>`;return}let names=rideNames(rs),s=summary(rs),L=n=>{let v=low(rs,n);return v==null?"—":v+" min"};view.innerHTML=`<div class="note"><b>${weatherLabel()}:</b> showing only snapshots matching this pattern${tab==="all"?" across all captured parties":" on "+fmtDate(tab)}.</div><div class="stats"><div class="stat"><small>TRON low</small><b>${L(HEAD[0])}</b></div><div class="stat"><small>Tiana’s low</small><b>${L(HEAD[1])}</b></div><div class="stat"><small>Big Thunder low</small><b>${L(HEAD[2])}</b></div><div class="stat"><small>Weather snapshots</small><b>${s.samples}</b></div></div><div class="stats"><div class="stat"><small>Temperature range</small><b>${s.hi!=null?Math.round(s.lo)+"–"+Math.round(s.hi)+"°F":"—"}</b></div><div class="stat"><small>Peak feels-like</small><b>${s.feel!=null?Math.round(s.feel)+"°F":"—"}</b></div><div class="stat"><small>Max recorded rain</small><b>${s.rain.toFixed(2)} in</b></div><div class="stat"><small>Rides represented</small><b>${names.length}</b></div></div><div class="section">RIDES <span class="count">${enabled.size} shown of ${names.length}</span></div><div class="ride-tools"><input id="search" class="search" placeholder="Find a ride…" value="${searchText.replaceAll('"','&quot;')}"><button class="chip" id="head">Headliners</button><button class="chip" id="allrides">Show all</button><button class="chip" id="clear">Clear</button></div><div class="controls" id="rides"></div><div class="section">ENTERTAINMENT OVERLAY</div><div class="controls" id="ec"></div><div class="chart-shell"><div class="scroll"><svg id="chart" viewBox="0 0 1040 560"></svg></div><div class="legend" id="legend"></div></div>`;let rb=document.getElementById("rides");names.filter(n=>n.toLowerCase().includes(searchText.toLowerCase())).forEach(n=>{let b=document.createElement("button");b.className="chip "+(enabled.has(n)?"active":"");b.textContent=n;b.onclick=()=>{enabled.has(n)?enabled.delete(n):enabled.add(n);render()};rb.appendChild(b)});document.getElementById("search").oninput=e=>{searchText=e.target.value;render()};document.getElementById("head").onclick=()=>{enabled=new Set(HEAD.filter(h=>names.includes(h)));render()};document.getElementById("allrides").onclick=()=>{enabled=new Set(names);render()};document.getElementById("clear").onclick=()=>{enabled.clear();render()};[["boo","Boo-To-You"],["fireworks","Fireworks"],["hocus","Hocus Pocus"]].forEach(([k,n])=>{let b=document.createElement("button");b.className="chip "+(eventsOn.has(k)?"active":"");b.textContent=n;b.onclick=()=>{eventsOn.has(k)?eventsOn.delete(k):eventsOn.add(k);render()};document.getElementById("ec").appendChild(b)});draw(rs,names)}
function draw(rs,names){const s=document.getElementById("chart"),W=1040,H=560,L=64,R=24,T=28,B=60,pw=W-L-R,ph=H-T-B,x=m=>L+(m-960)/480*pw,y=v=>T+(90-v)/90*ph,ns="http://www.w3.org/2000/svg";function E(t,a={},txt=""){let n=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(txt!=="")n.textContent=txt;s.appendChild(n);return n}E("rect",{x:0,y:0,width:W,height:H,fill:"#121821"});for(let v=0;v<=90;v+=15){E("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:"#2a3441"});E("text",{x:L-10,y:y(v)+4,"text-anchor":"end",fill:"#aab4c0","font-size":13},v)}for(let h=16;h<=23;h++)E("text",{x:x(h*60),y:H-22,"text-anchor":"middle",fill:"#aab4c0","font-size":13},(h>12?h-12:h)+" PM");evts().filter(e=>eventsOn.has(e.cat)).forEach((e,j)=>{let xx=x(e.m);E("line",{x1:xx,x2:xx,y1:T,y2:T+ph,stroke:"#ff8a3d","stroke-width":2,"stroke-dasharray":e.cat==="fireworks"?"9 6":"4 6"});E("text",{x:xx+5,y:T+15+(j%3)*16,fill:"#f6f7f9","font-size":11,"font-weight":700},e.name)});let active=names.filter(n=>enabled.has(n)),leg=document.getElementById("legend");active.forEach((n,i)=>{let c=COLORS[i%COLORS.length],p=points(rs,n);if(p.length>1)E("polyline",{points:p.map(q=>`${x(q.m)},${y(q.v)}`).join(" "),fill:"none",stroke:c,"stroke-width":active.length>10?2:4,"stroke-linecap":"round","stroke-linejoin":"round"});p.forEach(q=>{let z=E("circle",{cx:x(q.m),cy:y(q.v),r:active.length>10?3:5,fill:c});let title=document.createElementNS(ns,"title");if(tab==="all"&&q.pulls.length>1){title.textContent=`${n}: ${q.v} min | ${q.pulls.length} pulls: ${q.pulls.map(fmtPull).join("; ")}`}else{title.textContent=`${n}: ${q.v} min | Pulled ${fmtPull(q.pulls[q.pulls.length-1])}`}z.appendChild(title)});let sp=document.createElement("span");sp.innerHTML=`<i class="dot" style="background:${c}"></i>${n}`;leg.appendChild(sp)});if(!active.length)E("text",{x:W/2,y:H/2,"text-anchor":"middle",fill:"#aab4c0","font-size":18},"Select one or more rides above.")}
weatherSel.onchange=()=>{weather=weatherSel.value;resetEnabled();render()};const cacheBust=Date.now();Promise.all([fetch(`data/magic_kingdom_waits.csv?v=${cacheBust}`,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`wait data ${r.status}`);return r.text()}),fetch(`data/party_events.csv?v=${cacheBust}`,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`event data ${r.status}`);return r.text()})]).then(([w,e])=>{rows=csv(w);events=csv(e);dates=[...new Set(rows.map(r=>(r.party_date||"").trim()).filter(d=>/^2026-\d{2}-\d{2}$/.test(d)&&d>="2026-08-18"))].sort();resetEnabled();renderTabs();render()}).catch(e=>{view.innerHTML='<div class="empty">Could not load tracker data. Please refresh shortly.</div>';console.error(e)});</script></body></html>
