<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 MNSSHP Wait Time Tracker</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--card:#171f2a;--text:#f6f7f9;--muted:#aab4c0;--border:#2a3441;--accent:#ff8a3d;--weather:#4dd0e1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.app{max-width:1180px;margin:auto;padding:16px}h1{margin:0 0 4px;font-size:clamp(27px,6vw,44px)}.sub,.muted{color:var(--muted)}button,input{font:inherit}.tabs,.controls,.legend{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:16px 0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.tabs button,.chip{white-space:nowrap;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 13px}.tabs button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}.chip.active{outline:2px solid var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:23px;margin-top:3px}.weatherbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.weathercard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px}.weathercard small{color:var(--muted)}.weathercard b{display:block;font-size:18px;margin-top:2px}.section{font-size:12px;color:var(--muted);margin:12px 0 7px}.ride-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.search{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 11px;min-width:210px}.chart-shell{margin-top:12px;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--panel)}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}svg{display:block;width:100%;min-width:940px;height:auto}.legend{padding:10px 12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}.note{margin-top:14px;padding:13px;border-radius:15px;border:1px solid rgba(255,138,61,.35);background:rgba(255,138,61,.1);line-height:1.45}.empty,.loading{padding:38px 12px;text-align:center;color:var(--muted)}.empty{background:var(--panel);border:1px solid var(--border);border-radius:18px}.count{color:var(--muted);font-size:12px;margin-left:4px}@media(max-width:700px){.app{padding:12px}.stats,.weatherbar{grid-template-columns:repeat(2,1fr)}.stat b{font-size:21px}.search{width:100%}}
</style>
</head>
<body><main class="app"><h1>2026 MNSSHP Wait Time Tracker</h1><div class="sub">Magic Kingdom • Party-night ride waits, entertainment & weather</div><div class="tabs" id="tabs"></div><div id="view"><div class="loading">Loading party data…</div></div></main>
<script>
const HEADLINERS=["TRON Lightcycle / Run","Tiana's Bayou Adventure","Big Thunder Mountain Railroad","Haunted Mansion"];
const COLORS=["#59a7ff","#66d17a","#ffd166","#c58cff","#ff7f7f","#64d8cb","#f2a65a","#8ea1ff","#dc8cff","#9bd16f","#f48fb1","#80cbc4","#ffb74d","#90caf9","#ce93d8","#aed581","#ffcc80","#81d4fa","#ef9a9a","#b39ddb","#80deea","#c5e1a5","#ffe082","#bcaaa4","#b0bec5"];
let rows=[],events=[],partyDates=[],tab="all",enabled=new Set(),eventsOn=new Set(["boo","fireworks","hocus"]),weatherOn=true,searchText="";
const view=document.getElementById("view"),tabs=document.getElementById("tabs");
function csv(text){let out=[],row=[],field="",q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')q=false;else field+=c}else{if(c==='"')q=true;else if(c===','){row.push(field);field=""}else if(c==='\n'){row.push(field);out.push(row);row=[];field=""}else if(c!=='\r')field+=c}}if(field||row.length){row.push(field);out.push(row)}let h=out.shift();return out.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""])))}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}function tmins(iso){let d=new Date(iso);return d.getHours()*60+d.getMinutes()}function median(a){a=a.filter(Number.isFinite).sort((a,b)=>a-b);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function renderTabs(){tabs.innerHTML="";[["all","All Parties"],...partyDates.map(d=>[d,fmtDate(d)])].forEach(([k,n])=>{let b=document.createElement("button");b.textContent=n;b.dataset.tab=k;b.classList.toggle("active",k===tab);b.onclick=()=>{tab=k;renderTabs();resetEnabled();render()};tabs.appendChild(b)})}
function selectedRows(){return tab==="all"?rows.filter(r=>partyDates.includes(r.party_date)):rows.filter(r=>r.party_date===tab)}function rideNames(rs){return [...new Set(rs.filter(r=>r.posted_wait_minutes!=="").map(r=>r.ride_name))].sort((a,b)=>a.localeCompare(b))}function resetEnabled(){let n=rideNames(selectedRows());enabled=new Set(HEADLINERS.filter(h=>n.includes(h)));if(!enabled.size)n.slice(0,4).forEach(x=>enabled.add(x))}
function low(rs,name){let a=rs.filter(r=>r.ride_name===name&&r.posted_wait_minutes!=="").map(r=>+r.posted_wait_minutes);return a.length?Math.min(...a):null}
function pointsForRide(rs,name){let by={};rs.filter(r=>r.ride_name===name&&r.posted_wait_minutes!=="").forEach(r=>{let m=Math.round(tmins(r.snapshot_time)/15)*15;if(m<960||m>1440)return;(by[m]??=[]).push(+r.posted_wait_minutes)});return Object.entries(by).map(([m,a])=>({m:+m,v:tab==="all"?median(a):a[a.length-1]})).sort((a,b)=>a.m-b.m)}
function weatherPoints(rs){let seen=new Set(),out=[];for(let r of rs){if(!r.temperature_f||!r.snapshot_time)continue;let m=Math.round(tmins(r.snapshot_time)/15)*15,key=(tab==="all"?r.party_date+":"+m:m);if(seen.has(key))continue;seen.add(key);out.push({m,temp:+r.temperature_f,feel:r.feels_like_f?+r.feels_like_f:null,humid:r.humidity_pct?+r.humidity_pct:null,rain:r.precipitation_in?+r.precipitation_in:0})}if(tab!=="all")return out.sort((a,b)=>a.m-b.m);let by={};out.forEach(p=>{(by[p.m]??=[]).push(p)});return Object.entries(by).map(([m,a])=>({m:+m,temp:median(a.map(x=>x.temp)),feel:median(a.map(x=>x.feel)),humid:median(a.map(x=>x.humid)),rain:median(a.map(x=>x.rain))})).sort((a,b)=>a.m-b.m)}
function weatherSummary(rs){let w=weatherPoints(rs);if(!w.length)return null;let temps=w.map(x=>x.temp).filter(Number.isFinite),feels=w.map(x=>x.feel).filter(Number.isFinite),hum=w.map(x=>x.humid).filter(Number.isFinite),rain=w.map(x=>x.rain).filter(Number.isFinite);return{high:Math.max(...temps),low:Math.min(...temps),feel:feels.length?Math.max(...feels):null,humid:hum.length?Math.round(median(hum)):null,rain:rain.length?Math.max(...rain):0}}
function eventList(){let ds=tab==="all"?partyDates:[tab],seen=new Set(),out=[];events.filter(e=>ds.includes(e.party_date)&&e.show_start_time).forEach(e=>{let n=e.event_name.toLowerCase(),cat=n.includes("boo-to-you")?"boo":n.includes("hocus pocus")?"hocus":n.includes("not-so-spooky")||n.includes("not so spooky")?"fireworks":null;if(!cat)return;let m=tmins(e.show_start_time);if(m<960)m+=1440;let k=cat+":"+m;if(seen.has(k))return;seen.add(k);out.push({cat,m,name:cat==="boo"?"Boo-To-You":cat==="hocus"?"Hocus Pocus":"Fireworks"})});return out.sort((a,b)=>a.m-b.m)}
function render(){let rs=selectedRows();if(!rs.length){view.innerHTML='<div class="empty">No captured party data yet.</div>';return}let names=rideNames(rs),w=weatherSummary(rs),tron=low(rs,HEADLINERS[0]),tiana=low(rs,HEADLINERS[1]),bt=low(rs,HEADLINERS[2]);view.innerHTML=`${tab==="all"?`<div class="note"><b>All Parties:</b> ${partyDates.length} captured party${partyDates.length===1?"":"ies"}. ${partyDates.length===1?"This currently matches the Aug 18 baseline.":"Clock-time ride and weather points use medians across captured parties."}</div>`:""}<div class="stats"><div class="stat"><small>TRON low</small><b>${tron??"—"}${tron!=null?" min":""}</b></div><div class="stat"><small>Tiana’s low</small><b>${tiana??"—"}${tiana!=null?" min":""}</b></div><div class="stat"><small>Big Thunder low</small><b>${bt??"—"}${bt!=null?" min":""}</b></div><div class="stat"><small>Rides captured</small><b>${names.length}</b></div></div>${w?`<div class="section">WEATHER</div><div class="weatherbar"><div class="weathercard"><small>Party high / low</small><b>${Math.round(w.high)}° / ${Math.round(w.low)}°F</b></div><div class="weathercard"><small>Peak feels-like</small><b>${w.feel!=null?Math.round(w.feel)+"°F":"—"}</b></div><div class="weathercard"><small>Median humidity</small><b>${w.humid!=null?w.humid+"%":"—"}</b></div><div class="weathercard"><small>Recorded rain</small><b>${w.rain>0?w.rain.toFixed(2)+" in":"0.00 in"}</b></div></div>`:""}<div class="section">RIDES <span class="count">${enabled.size} shown of ${names.length}</span></div><div class="ride-tools"><input id="search" class="search" type="search" placeholder="Find a ride…" value="${searchText.replaceAll('"','&quot;')}"><button class="chip" id="headliners">Headliners</button><button class="chip" id="showall">Show all</button><button class="chip" id="clearall">Clear</button></div><div class="controls" id="rides"></div><div class="section">OVERLAYS</div><div class="controls" id="overlayControls"></div><div class="chart-shell"><div class="scroll"><svg id="chart" viewBox="0 0 1040 580"></svg></div><div class="legend" id="legend"></div></div><div class="note"><b>Weather overlay:</b> Temperature and feels-like are plotted as dashed lines against the right-side °F scale, so you can visually compare cooling conditions with ride waits and entertainment windows.</div>`;
let rb=document.getElementById("rides");names.filter(n=>n.toLowerCase().includes(searchText.toLowerCase())).forEach(n=>{let b=document.createElement("button");b.className="chip "+(enabled.has(n)?"active":"");b.textContent=n;b.onclick=()=>{enabled.has(n)?enabled.delete(n):enabled.add(n);render()};rb.appendChild(b)});document.getElementById("search").oninput=e=>{searchText=e.target.value;render()};document.getElementById("headliners").onclick=()=>{enabled=new Set(HEADLINERS.filter(h=>names.includes(h)));render()};document.getElementById("showall").onclick=()=>{enabled=new Set(names);render()};document.getElementById("clearall").onclick=()=>{enabled.clear();render()};[["boo","Boo-To-You"],["fireworks","Fireworks"],["hocus","Hocus Pocus"]].forEach(([k,n])=>{let b=document.createElement("button");b.className="chip "+(eventsOn.has(k)?"active":"");b.textContent=n;b.onclick=()=>{eventsOn.has(k)?eventsOn.delete(k):eventsOn.add(k);render()};document.getElementById("overlayControls").appendChild(b)});let wb=document.createElement("button");wb.className="chip "+(weatherOn?"active":"");wb.textContent="Weather";wb.onclick=()=>{weatherOn=!weatherOn;render()};document.getElementById("overlayControls").appendChild(wb);draw(rs,names)}
function draw(rs,names){const s=document.getElementById("chart"),W=1040,H=580,L=64,R=54,T=28,B=60,pw=W-L-R,ph=H-T-B,minM=960,maxM=1440,x=m=>L+(m-minM)/(maxM-minM)*pw,y=v=>T+(90-v)/90*ph,yT=v=>T+(110-v)/(110-70)*ph,ns="http://www.w3.org/2000/svg";function E(t,a={},txt=""){let n=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(txt!=="")n.textContent=txt;s.appendChild(n);return n}E("rect",{x:0,y:0,width:W,height:H,fill:"#121821"});for(let v=0;v<=90;v+=15){E("line",{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:"#2a3441"});E("text",{x:L-10,y:y(v)+4,"text-anchor":"end",fill:"#aab4c0","font-size":13},v)}for(let h=16;h<=23;h++)E("text",{x:x(h*60),y:H-22,"text-anchor":"middle",fill:"#aab4c0","font-size":13},(h>12?h-12:h)+" PM");let xs=x(1095),xe=x(1110);E("rect",{x:xs,y:T,width:xe-xs,height:ph,fill:"#fff",opacity:.05});eventList().filter(e=>eventsOn.has(e.cat)).forEach((e,j)=>{let xx=x(e.m);E("line",{x1:xx,x2:xx,y1:T,y2:T+ph,stroke:"#ff8a3d","stroke-width":2,"stroke-dasharray":e.cat==="fireworks"?"9 6":"4 6"});E("text",{x:xx+5,y:T+15+(j%3)*16,fill:"#f6f7f9","font-size":11,"font-weight":700},e.name)});let active=names.filter(n=>enabled.has(n)),legend=document.getElementById("legend");active.forEach((name,i)=>{let color=COLORS[i%COLORS.length],pts=pointsForRide(rs,name);if(pts.length>1)E("polyline",{points:pts.map(p=>`${x(p.m)},${y(p.v)}`).join(" "),fill:"none",stroke:color,"stroke-width":active.length>10?2:4,"stroke-linecap":"round","stroke-linejoin":"round",opacity:active.length>12?.82:1});let span=document.createElement("span");span.innerHTML=`<i class="dot" style="background:${color}"></i>${name}`;legend.appendChild(span)});if(weatherOn){let wp=weatherPoints(rs);if(wp.length>1){E("polyline",{points:wp.map(p=>`${x(p.m)},${yT(p.temp)}`).join(" "),fill:"none",stroke:"#4dd0e1","stroke-width":3,"stroke-dasharray":"8 5"});let feel=wp.filter(p=>p.feel!=null);if(feel.length>1)E("polyline",{points:feel.map(p=>`${x(p.m)},${yT(p.feel)}`).join(" "),fill:"none",stroke:"#b2ebf2","stroke-width":2,"stroke-dasharray":"3 5"});for(let v=70;v<=110;v+=10)E("text",{x:W-R+8,y:yT(v)+4,fill:"#4dd0e1","font-size":12},v+"°");let a=document.createElement("span");a.innerHTML='<i class="dot" style="background:#4dd0e1"></i>Temperature';legend.appendChild(a);let b=document.createElement("span");b.innerHTML='<i class="dot" style="background:#b2ebf2"></i>Feels-like';legend.appendChild(b)}}if(!active.length&&!weatherOn)E("text",{x:W/2,y:H/2,"text-anchor":"middle",fill:"#aab4c0","font-size":18},"Select a ride or weather overlay above.")}
Promise.all([fetch("data/magic_kingdom_waits.csv",{cache:"no-store"}).then(r=>r.text()),fetch("data/party_events.csv",{cache:"no-store"}).then(r=>r.text())]).then(([w,e])=>{rows=csv(w);events=csv(e);partyDates=[...new Set(rows.map(r=>r.party_date).filter(d=>d>="2026-08-18"))].sort();if(!partyDates.length)throw new Error("No party data");tab="all";resetEnabled();renderTabs();render()}).catch(err=>{view.innerHTML='<div class="empty">Could not load tracker data. Please refresh in a moment.</div>';console.error(err)});
</script></body></html>
