name: Build location strategy

on:
  push:
    branches: [main]
    paths:
      - 'data/magic_kingdom_waits.csv'
      - 'data/party_events.csv'
      - 'data/location_reference.json'
      - 'scripts/location_strategy.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build strategy
        run: python scripts/location_strategy.py
      - name: Commit generated strategy
        run: |
          if git diff --quiet -- data/location_strategy.json; then
            echo "No strategy changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/location_strategy.json
          git commit -m "Update location strategy analysis"
          git push
