name: Collect MNSSHP Wait Times

on:
  schedule:
    # GitHub cron uses UTC.
    # 20:03-03:48 UTC = 4:03 PM-11:48 PM EDT
    # Runs every 15 minutes during our collection window.
    - cron: '3,18,33,48 20-23 * * *'
    - cron: '3,18,33,48 0-3 * * *'

  # Allows us to test it manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Collect wait times
        run: python collect_waits.py

      - name: Commit new data
        run: |
          git config user.name "MNSSHP Wait Tracker"
          git config user.email "actions@github.com"

          git add data/magic_kingdom_waits.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new wait-time data to commit."
          else
            git commit -m "Update Magic Kingdom wait times"
            git push
          fi
