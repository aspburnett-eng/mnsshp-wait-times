name: Collect MNSSHP Wait Times

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Collect wait times
        run: python collect_waits.py

      - name: Commit new data
        run: |
          git config user.name "MNSSHP Wait Tracker"
          git config user.email "actions@github.com"

          git add data/magic_kingdom_waits.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new wait-time data to commit."
          else
            git commit -m "Update Magic Kingdom wait times"
            git push
          fi
