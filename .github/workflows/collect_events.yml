name: Collect MNSSHP Events

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mnsshp-event-collector
  cancel-in-progress: false

jobs:
  collect-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Collect entertainment schedule
        run: python collect_events.py

      - name: Commit event data
        run: |
          git config user.name "MNSSHP Event Tracker"
          git config user.email "actions@github.com"

          git add data/party_events.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new event data to commit."
          else
            git commit -m "Update MNSSHP entertainment schedule"
            git pull --rebase origin main
            git push origin main
          fi
